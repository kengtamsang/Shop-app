<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เก่งตามสั่ง - ระบบสต๊อกและคำนวณกำไร</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    div[data-netlify-deploy-id], iframe[src*="netlify"], #netlify-badge {
      display: none !important;
    }
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans pb-24">

  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 p-4 sticky top-0 z-50 shadow-lg">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-lg font-bold text-emerald-400 flex items-center gap-2">
        <i class="fa-solid fa-utensils"></i> เก่งตามสั่ง
      </h1>
      <span id="system-status" class="text-xs bg-emerald-950 text-emerald-300 px-2.5 py-1 rounded-full border border-emerald-800">
        v7.2 Stable
      </span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-5">

    <!-- TAB 1: ภาพรวม / บันทึกขาย -->
    <div id="tab-overview" class="tab-content active space-y-4">
      
      <!-- สรุปผลประกอบการ -->
      <section class="bg-gray-800 p-4 rounded-2xl border border-gray-700">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-sm font-semibold text-gray-200 flex items-center gap-2">
            <i class="fa-solid fa-chart-pie text-emerald-400"></i> สรุปผลวันนี้
          </h2>
          <span id="current-date" class="text-xs text-gray-400"></span>
        </div>
        
        <div class="grid grid-cols-2 gap-2.5">
          <div class="bg-gray-900/80 p-3 rounded-xl border border-gray-700/60">
            <p class="text-[11px] text-gray-400">ยอดขายรวม</p>
            <p id="total-sales" class="text-lg font-bold text-emerald-400">฿0</p>
          </div>
          <div class="bg-gray-900/80 p-3 rounded-xl border border-gray-700/60">
            <p class="text-[11px] text-gray-400">ต้นทุนวัตถุดิบ</p>
            <p id="total-cost" class="text-lg font-bold text-rose-400">฿0</p>
          </div>
          <div class="bg-gray-900/80 p-3 rounded-xl border border-gray-700/60">
            <p class="text-[11px] text-gray-400">กำไรขั้นต้น</p>
            <p id="total-profit" class="text-lg font-bold text-amber-400">฿0</p>
          </div>
          <div class="bg-gray-900/80 p-3 rounded-xl border border-gray-700/60">
            <p class="text-[11px] text-gray-400">อัตรากำไร</p>
            <p id="profit-margin" class="text-lg font-bold text-blue-400">0%</p>
          </div>
        </div>
      </section>

      <!-- บันทึกรายการขายวันนี้ -->
      <section class="bg-gray-800 p-4 rounded-2xl border border-gray-700 space-y-3">
        <h3 class="text-sm font-semibold text-gray-200 flex items-center gap-2">
          <i class="fa-solid fa-cart-plus text-emerald-400"></i> บันทึกขาย (ตัดสต๊อกทันที)
        </h3>
        <div class="space-y-2">
          <div>
            <label class="text-xs text-gray-400 block mb-1">เลือกเมนูอาหาร</label>
            <select id="sell-menu-select" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-sm text-gray-100 focus:outline-none focus:border-emerald-500">
            </select>
          </div>
          <div class="flex gap-2">
            <div class="w-1/2">
              <label class="text-xs text-gray-400 block mb-1">จำนวน (จาน)</label>
              <input type="number" id="sell-qty" value="1" min="1" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-sm text-gray-100 focus:outline-none focus:border-emerald-500">
            </div>
            <div class="w-1/2 flex items-end">
              <button onclick="recordSale()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-medium py-2.5 rounded-xl text-sm transition">
                + บันทึกการขาย
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- แจ้งเตือนวัตถุดิบใกล้หมด -->
      <section class="bg-amber-950/20 border border-amber-800/50 p-4 rounded-2xl space-y-2">
        <h3 class="text-xs font-semibold text-amber-300 flex items-center gap-2">
          <i class="fa-solid fa-triangle-exclamation animate-pulse"></i> แจ้งเตือนสต๊อกวิกฤต
        </h3>
        <div id="stock-alerts" class="space-y-1.5 text-xs text-gray-300">
        </div>
      </section>
    </div>

    <!-- TAB 2: คลังวัตถุดิบ -->
    <div id="tab-inventory" class="tab-content space-y-4">
      <section class="bg-gray-800 p-4 rounded-2xl border border-gray-700 space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-semibold text-gray-200 flex items-center gap-2">
            <i class="fa-solid fa-boxes-stacked text-blue-400"></i> รายการวัตถุดิบ
          </h2>
          <button onclick="openAddStockModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded-lg transition">
            + รับเข้าวัตถุดิบ
          </button>
        </div>

        <div id="stock-list" class="space-y-2 text-sm">
        </div>
      </section>
    </div>

    <!-- TAB 3: สูตรอาหาร & ต้นทุน -->
    <div id="tab-recipes" class="tab-content space-y-4">
      <section class="bg-gray-800 p-4 rounded-2xl border border-gray-700 space-y-3">
        <h2 class="text-sm font-semibold text-gray-200 flex items-center gap-2">
          <i class="fa-solid fa-book-open text-purple-400"></i> สูตรอาหาร & คำนวณต้นทุน/จาน
        </h2>
        <div id="recipe-list" class="space-y-3">
        </div>
      </section>
    </div>

  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-gray-800 border-t border-gray-700 py-2.5 px-4 z-40">
    <div class="max-w-md mx-auto flex justify-around items-center text-xs text-gray-400">
      <button onclick="switchTab('overview')" id="nav-overview" class="flex flex-col items-center text-emerald-400">
        <i class="fa-solid fa-house text-base"></i>
        <span class="mt-1">ภาพรวม</span>
      </button>
      <button onclick="switchTab('inventory')" id="nav-inventory" class="flex flex-col items-center hover:text-gray-200">
        <i class="fa-solid fa-boxes-stacked text-base"></i>
        <span class="mt-1">สต๊อก</span>
      </button>
      <button onclick="switchTab('recipes')" id="nav-recipes" class="flex flex-col items-center hover:text-gray-200">
        <i class="fa-solid fa-book-open text-base"></i>
        <span class="mt-1">สูตรอาหาร</span>
      </button>
    </div>
  </nav>

  <script>
    const defaultData = {
      inventory: [
        { id: 'pork', name: 'หมูบด', qty: 2.5, unit: 'กก.', costPerUnit: 160, alertThreshold: 1.0 },
        { id: 'rice', name: 'ข้าวหอมมะลิ', qty: 15.0, unit: 'กก.', costPerUnit: 35, alertThreshold: 3.0 },
        { id: 'egg', name: 'ไข่ไก่ (เบอร์ 2)', qty: 60, unit: 'ฟอง', costPerUnit: 4.2, alertThreshold: 10 },
        { id: 'oil', name: 'น้ำมันพืช', qty: 3.0, unit: 'ลิตร', costPerUnit: 55, alertThreshold: 0.5 },
        { id: 'basil', name: 'ใบกะเพรา', qty: 0.5, unit: 'กก.', costPerUnit: 80, alertThreshold: 0.2 }
      ],
      recipes: [
        {
          id: 'r1',
          name: 'ผัดกะเพราหมูสับ',
          price: 60,
          ingredients: [
            { id: 'pork', qty: 0.08 },
            { id: 'rice', qty: 0.2 },
            { id: 'oil', qty: 0.01 },
            { id: 'basil', qty: 0.02 }
          ]
        },
        {
          id: 'r2',
          name: 'ข้าวไข่เจียว',
          price: 40,
          ingredients: [
            { id: 'egg', qty: 2 },
            { id: 'rice', qty: 0.2 },
            { id: 'oil', qty: 0.02 }
          ]
        }
      ],
      salesHistory: []
    };

    let appData = JSON.parse(localStorage.getItem('kengtamsang_db')) || defaultData;

    function saveData() {
      localStorage.setItem('kengtamsang_db', JSON.stringify(appData));
      renderAll();
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('text-emerald-400'));
      
      document.getElementById('tab-' + tabName).classList.add('active');
      document.getElementById('nav-' + tabName).classList.add('text-emerald-400');
    }

    function renderAll() {
      renderOverview();
      renderInventory();
      renderRecipes();
      renderMenuSelect();
    }

    function renderOverview() {
      document.getElementById('current-date').innerText = new Date().toLocaleDateString('th-TH');
      
      let sales = 0;
      let cost = 0;

      appData.salesHistory.forEach(item => {
        sales += item.totalSales;
        cost += item.totalCost;
      });

      const profit = sales - cost;
      const margin = sales > 0 ? ((profit / sales) * 100).toFixed(1) : 0;

      document.getElementById('total-sales').innerText = `฿${sales.toLocaleString()}`;
      document.getElementById('total-cost').innerText = `฿${cost.toLocaleString()}`;
      document.getElementById('total-profit').innerText = `฿${profit.toLocaleString()}`;
      document.getElementById('profit-margin').innerText = `${margin}%`;

      const alertContainer = document.getElementById('stock-alerts');
      alertContainer.innerHTML = '';
      let hasAlert = false;

      appData.inventory.forEach(item => {
        if (item.qty <= item.alertThreshold) {
          hasAlert = true;
          alertContainer.innerHTML += `
            <div class="bg-gray-900/80 p-2 rounded-xl border border-amber-900/40 flex justify-between items-center">
              <div>
                <p class="font-bold text-gray-200">${item.name}</p>
                <p class="text-[10px] text-gray-400">เหลือเพียง ${item.qty.toFixed(2)} ${item.unit}</p>
              </div>
              <span class="px-2 py-0.5 bg-rose-500/20 text-rose-400 rounded text-[10px] font-bold">ใกล้หมด</span>
            </div>
          `;
        }
      });

      if (!hasAlert) {
        alertContainer.innerHTML = '<p class="text-xs text-emerald-400">วัตถุดิบทั้งหมดอยู่ในระดับปลอดภัย</p>';
      }
    }

    function renderInventory() {
      const container = document.getElementById('stock-list');
      container.innerHTML = '';

      appData.inventory.forEach(item => {
        container.innerHTML += `
          <div class="bg-gray-900 p-3 rounded-xl border border-gray-700/80 flex justify-between items-center">
            <div>
              <p class="font-bold text-gray-100">${item.name}</p>
              <p class="text-xs text-gray-400">ทุน: ฿${item.costPerUnit} / ${item.unit}</p>
            </div>
            <div class="text-right">
              <p class="font-bold ${item.qty <= item.alertThreshold ? 'text-rose-400' : 'text-emerald-400'}">
                ${item.qty.toFixed(2)} ${item.unit}
              </p>
              <div class="flex gap-1 mt-1">
                <button onclick="adjustStock('${item.id}', 1)" class="px-2 py-0.5 bg-emerald-900/80 text-emerald-300 text-xs rounded border border-emerald-700">+1</button>
                <button onclick="adjustStock('${item.id}', -1)" class="px-2 py-0.5 bg-rose-900/80 text-rose-300 text-xs rounded border border-rose-700">-1</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function renderRecipes() {
      const container = document.getElementById('recipe-list');
      container.innerHTML = '';

      appData.recipes.forEach(recipe => {
        let dishCost = 0;
        let ingDetails = '';

        recipe.ingredients.forEach(ing => {
          const item = appData.inventory.find(i => i.id === ing.id);
          if (item) {
            const cost = ing.qty * item.costPerUnit;
            dishCost += cost;
            ingDetails += `<div class="flex justify-between"><span>• ${item.name} (${ing.qty} ${item.unit})</span><span class="text-gray-400">฿${cost.toFixed(2)}</span></div>`;
          }
        });

        const profit = recipe.price - dishCost;
        const margin = ((profit / recipe.price) * 100).toFixed(1);

        container.innerHTML += `
          <div class="bg-gray-900 p-3.5 rounded-xl border border-gray-700 space-y-2">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-bold text-gray-100">${recipe.name}</h3>
                <p class="text-xs text-gray-400">ราคาขาย: <span class="text-emerald-400 font-bold">฿${recipe.price}</span></p>
              </div>
              <div class="text-right">
                <p class="text-xs text-gray-400">ต้นทุนวัตถุดิบ/จาน</p>
                <p class="text-sm font-bold text-rose-400">฿${dishCost.toFixed(2)}</p>
                <p class="text-[10px] text-emerald-400">กำไร ฿${profit.toFixed(2)} (${margin}%)</p>
              </div>
            </div>
            <div class="border-t border-gray-800 pt-2 space-y-1 text-xs text-gray-300">
              ${ingDetails}
            </div>
          </div>
        `;
      });
    }

    function renderMenuSelect() {
      const select = document.getElementById('sell-menu-select');
      select.innerHTML = '';
      appData.recipes.forEach(r => {
        select.innerHTML += `<option value="${r.id}">${r.name} - ฿${r.price}</option>`;
      });
    }

    function adjustStock(id, amount) {
      const item = appData.inventory.find(i => i.id === id);
      if (item) {
        item.qty = Math.max(0, item.qty + amount);
        saveData();
      }
    }

    function recordSale() {
      const recipeId = document.getElementById('sell-menu-select').value;
      const qty = parseInt(document.getElementById('sell-qty').value) || 1;
      const recipe = appData.recipes.find(r => r.id === recipeId);

      if (!recipe) return;

      let dishCost = 0;
      recipe.ingredients.forEach(ing => {
        const item = appData.inventory.find(i => i.id === ing.id);
        if (item) {
          item.qty = Math.max(0, item.qty - (ing.qty * qty));
          dishCost += (ing.qty * item.costPerUnit);
        }
      });

      appData.salesHistory.push({
        recipeId: recipe.id,
        qty: qty,
        totalSales: recipe.price * qty,
        totalCost: dishCost * qty,
        timestamp: new Date().toISOString()
      });

      saveData();
      alert(`บันทึกขาย ${recipe.name} (${qty} จาน) เรียบร้อย!`);
    }

    function openAddStockModal() {
      const name = prompt("ชื่อวัตถุดิบใหม่:");
      if (!name) return;
      const cost = parseFloat(prompt("ราคาต่อหน่วย (บาท):")) || 0;
      const qty = parseFloat(prompt("จำนวนที่รับเข้า:")) || 0;
      const unit = prompt("หน่วยนับ (เช่น กก., ฟอง, ลิตร):") || 'ชิ้น';

      appData.inventory.push({
        id: 'ing_' + Date.now(),
        name: name,
        qty: qty,
        unit: unit,
        costPerUnit: cost,
        alertThreshold: 1.0
      });

      saveData();
    }

    renderAll();
  </script>
</body>
</html>
