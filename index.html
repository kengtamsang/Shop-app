<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บัญชีร้านค้า & วิเคราะห์กำไร - เก่งตามสั่ง</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    div[data-netlify-deploy-id], iframe[src*="netlify"], #netlify-badge {
      display: none !important;
    }
    body {
      background-color: #f3f4f6;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .tab-btn.active {
      background-color: #3b82f6;
      color: white;
    }
  </style>
</head>
<body class="pb-10">

  <div class="max-w-md mx-auto bg-white min-h-screen shadow-md flex flex-col">
    
    <!-- Title Bar -->
    <div class="p-4 text-center border-b border-gray-100">
      <h1 class="text-xl font-bold text-blue-600 flex items-center justify-center gap-2">
        📊 บัญชีร้านค้า & วิเคราะห์กำไร
      </h1>
    </div>

    <!-- Navigation Tabs -->
    <div class="p-3 grid grid-cols-3 gap-2 bg-gray-50 border-b border-gray-200 text-xs font-medium">
      <button onclick="switchTab('income')" id="tab-income" class="tab-btn active py-2 px-1 rounded-lg border border-blue-200 flex items-center justify-center gap-1 shadow-sm">
        <span>🟦</span> บันทึกรายรับ
      </button>
      <button onclick="switchTab('expense')" id="tab-expense" class="tab-btn bg-white text-gray-700 py-2 px-1 rounded-lg border border-gray-200 flex items-center justify-center gap-1">
        <span>💸</span> บันทึกรายจ่าย
      </button>
      <button onclick="switchTab('cost')" id="tab-cost" class="tab-btn bg-white text-gray-700 py-2 px-1 rounded-lg border border-gray-200 flex items-center justify-center gap-1">
        <span>⚙️</span> ต้นทุนหลังบ้าน
      </button>
    </div>

    <div class="p-4 space-y-5 flex-1">

      <!-- Form Section -->
      <div id="form-section" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">วันที่ขาย:</label>
          <input type="date" id="record-date" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label id="name-label" class="block text-xs font-semibold text-gray-700 mb-1">ชื่อรายการอาหาร/เครื่องดื่ม:</label>
          <input type="text" id="item-name" placeholder="เช่น ยำวุ้นเส้น, สุกี้หมู" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">จำนวน:</label>
            <input type="number" id="item-qty" value="1" min="1" oninput="calculateTotal()" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">หน่วยนับ:</label>
            <input type="text" id="item-unit" value="จาน" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">ราคา/หน่วย (บาท):</label>
            <input type="number" id="item-price" placeholder="เช่น 70" oninput="calculateTotal()" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">ราคารวม (บาท):</label>
            <input type="number" id="item-total" placeholder="เช่น 70" readonly class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2.5 text-sm text-gray-600 font-semibold">
          </div>
        </div>

        <button onclick="addRecord()" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow transition text-sm">
          + บันทึกรายรับ
        </button>
      </div>

      <!-- Date Filter Section -->
      <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl space-y-1">
        <label class="block text-xs font-semibold text-amber-800 flex items-center gap-1">
          🔍 เลือกวันที่ดูสรุปผลงาน:
        </label>
        <input type="date" id="filter-date" onchange="renderData()" class="w-full bg-white border border-amber-300 rounded-lg p-2 text-sm focus:outline-none">
      </div>

      <!-- Summary Box (กล่องสีเขียวเดิม) -->
      <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl space-y-2 text-sm">
        <div class="flex justify-between items-center text-gray-700">
          <span>ยอดขายรวม (รายรับ):</span>
          <span id="sum-income" class="font-bold text-emerald-600">0 บ.</span>
        </div>
        <div class="flex justify-between items-center text-gray-700">
          <span>ต้นทุนเมนูที่ขาย (หลังบ้าน):</span>
          <span id="sum-menu-cost" class="font-bold text-rose-500">0 บ.</span>
        </div>
        <div class="flex justify-between items-center text-gray-700">
          <span>รายจ่ายซื้อของ/ค่าใช้จ่ายร้าน:</span>
          <span id="sum-expense" class="font-bold text-rose-500">0 บ.</span>
        </div>
        <hr class="border-emerald-200 my-1">
        <div class="flex justify-between items-center pt-1">
          <span class="font-bold text-base text-gray-800">กำไรสุทธิ (Net Profit):</span>
          <div class="text-right">
            <span id="sum-net-profit" class="font-bold text-xl text-blue-600">0 บ.</span>
            <div id="sum-margin" class="text-[10px] text-gray-500 font-medium">อัตรากำไร: 0%</div>
          </div>
        </div>
      </div>

      <!-- Table Section -->
      <div class="space-y-2">
        <h3 class="text-xs font-bold text-gray-700">ตารางรวมรายการบันทึกประจำวัน</h3>
        <div class="overflow-x-auto border border-gray-200 rounded-lg">
          <table class="w-full text-xs text-left">
            <thead class="bg-gray-100 text-gray-600 uppercase border-b border-gray-200">
              <tr>
                <th class="p-2">ประเภท</th>
                <th class="p-2">รายการ</th>
                <th class="p-2 text-center">จำนวน</th>
                <th class="p-2 text-right">รวม (บ.)</th>
                <th class="p-2 text-center">ลบ</th>
              </tr>
            </thead>
            <tbody id="data-table-body" class="divide-y divide-gray-100 bg-white">
              <!-- ข้อมูลจะแสดงตรงนี้ -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script>
    let currentTab = 'income';
    const todayStr = new Date().toISOString().split('T')[0];
    
    document.getElementById('record-date').value = todayStr;
    document.getElementById('filter-date').value = todayStr;

    let storeData = JSON.parse(localStorage.getItem('keng_store_db')) || {
      records: [],
      menuCosts: {} // บันทึกต้นทุนหลังบ้าน
    };

    function saveData() {
      localStorage.setItem('keng_store_db', JSON.stringify(storeData));
      renderData();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active', 'bg-blue-600', 'text-white');
        btn.classList.add('bg-white', 'text-gray-700');
      });

      const btn = document.getElementById('tab-' + tab);
      btn.classList.add('active');

      const nameLabel = document.getElementById('name-label');
      const submitBtn = document.getElementById('submit-btn');

      if (tab === 'income') {
        nameLabel.innerText = 'ชื่อรายการอาหาร/เครื่องดื่ม:';
        submitBtn.innerText = '+ บันทึกรายรับ';
        submitBtn.className = 'w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow transition text-sm';
      } else if (tab === 'expense') {
        nameLabel.innerText = 'ชื่อรายการค่าใช้จ่าย/ซื้อของ:';
        submitBtn.innerText = '+ บันทึกรายจ่าย';
        submitBtn.className = 'w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl shadow transition text-sm';
      } else if (tab === 'cost') {
        nameLabel.innerText = 'ชื่อเมนูอาหารที่ต้องการตั้งต้นทุน:';
        submitBtn.innerText = '💾 บันทึกต้นทุนเมนู';
        submitBtn.className = 'w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow transition text-sm';
      }
    }

    function calculateTotal() {
      const qty = parseFloat(document.getElementById('item-qty').value) || 0;
      const price = parseFloat(document.getElementById('item-price').value) || 0;
      document.getElementById('item-total').value = qty * price;
    }

    function addRecord() {
      const date = document.getElementById('record-date').value;
      const name = document.getElementById('item-name').value.trim();
      const qty = parseFloat(document.getElementById('item-qty').value) || 0;
      const unit = document.getElementById('item-unit').value.trim() || 'จาน';
      const price = parseFloat(document.getElementById('item-price').value) || 0;
      const total = qty * price;

      if (!name || total <= 0) {
        alert('กรุณากรอกชื่อรายการและจำนวน/ราคาให้ถูกต้อง');
        return;
      }

      if (currentTab === 'cost') {
        // บันทึกต้นทุนหลังบ้าน
        storeData.menuCosts[name] = price;
        alert(`บันทึกต้นทุนหลังบ้านของ "${name}" เท่ากับ ฿${price} เรียบร้อยแล้ว`);
      } else {
        // บันทึกรายรับ / รายจ่าย
        storeData.records.push({
          id: Date.now(),
          type: currentTab,
          date: date,
          name: name,
          qty: qty,
          unit: unit,
          price: price,
          total: total
        });
      }

      // รีเซ็ตฟอร์ม
      document.getElementById('item-name').value = '';
      document.getElementById('item-price').value = '';
      document.getElementById('item-total').value = '';

      saveData();
    }

    function deleteRecord(id) {
      if (confirm('ต้องการลบรายการนี้ใช่หรือไม่?')) {
        storeData.records = storeData.records.filter(r => r.id !== id);
        saveData();
      }
    }

    function renderData() {
      const filterDate = document.getElementById('filter-date').value;
      const tbody = document.getElementById('data-table-body');
      tbody.innerHTML = '';

      let incomeSum = 0;
      let expenseSum = 0;
      let menuCostSum = 0;

      const filtered = storeData.records.filter(r => r.date === filterDate);

      filtered.forEach(item => {
        if (item.type === 'income') {
          incomeSum += item.total;
          // คำนวณต้นทุนหลังบ้านตามเมนู
          const unitCost = storeData.menuCosts[item.name] || 0;
          menuCostSum += (unitCost * item.qty);
        } else if (item.type === 'expense') {
          expenseSum += item.total;
        }

        const isIncome = item.type === 'income';
        tbody.innerHTML += `
          <tr class="hover:bg-gray-50">
            <td class="p-2 font-bold ${isIncome ? 'text-blue-600' : 'text-rose-500'}">
              ${isIncome ? 'รายรับ' : 'รายจ่าย'}
            </td>
            <td class="p-2 font-medium text-gray-800">${item.name}</td>
            <td class="p-2 text-center">${item.qty} ${item.unit}</td>
            <td class="p-2 text-right font-semibold">${item.total.toLocaleString()}</td>
            <td class="p-2 text-center">
              <button onclick="deleteRecord(${item.id})" class="text-gray-400 hover:text-rose-600">❌</button>
            </td>
          </tr>
        `;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">ไม่มีข้อมูลบันทึกในวันที่เลือก</td></tr>`;
      }

      const netProfit = incomeSum - menuCostSum - expenseSum;
      const margin = incomeSum > 0 ? ((netProfit / incomeSum) * 100).toFixed(1) : 0;

      document.getElementById('sum-income').innerText = `${incomeSum.toLocaleString()} บ.`;
      document.getElementById('sum-menu-cost').innerText = `${menuCostSum.toLocaleString()} บ.`;
      document.getElementById('sum-expense').innerText = `${expenseSum.toLocaleString()} บ.`;
      document.getElementById('sum-net-profit').innerText = `${netProfit.toLocaleString()} บ.`;
      document.getElementById('sum-margin').innerText = `อัตรากำไร: ${margin}%`;
    }

    renderData();
  </script>
</body>
</html>
